<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révisions Terminale HG-EMC</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:20px;text-align:center}
.btn{padding:12px 18px;margin:8px;border:none;border-radius:10px;color:white;font-size:18px;cursor:pointer}
.histoire{background:linear-gradient(45deg,#ff8c00,#7b2cbf)}
.geo{background:linear-gradient(45deg,#2196f3,#2e8b57)}
.emc{background:#c62828}
.card{margin-top:20px;padding:20px;border:1px solid #ddd;border-radius:12px}
</style>
</head>
<body>
<h1>Révisions Terminale</h1>
<p>Choisissez une catégorie.</p>

<button class="btn histoire" onclick="tirer('h')">Histoire</button>
<button class="btn geo" onclick="tirer('g')">Géographie</button>
<button class="btn emc" onclick="tirer('e')">EMC</button>

<div class="card">
<h2 id="matiere">...</h2>
<div id="question">Cliquez sur une matière</div>
<div id="reponse" style="margin-top:15px"></div>
</div>

<script>
const data={
h:[
["Que signifie SDN ?","Société des Nations"],
["En quelle année a lieu le krach de Wall Street ?","1929"],
["Qui dirige l'URSS dans les années 1930 ?","Staline"],
["Qui devient chancelier en 1933 ?","Hitler"],
["Que signifie ONU ?","Organisation des Nations Unies"]
],
g:[
["Que signifie ZEE ?","Zone Économique Exclusive"],
["Quelle part du commerce mondial passe par mer ?","Environ 90 %"],
["Qu'est-ce qu'un archipel ?","Un ensemble d'îles"],
["Qu'est-ce qu'un détroit ?","Une bande de mer entre deux terres"],
["Quel port est un des premiers mondiaux ?","Shanghai"]
],
e:[
["Quelle est la devise de la République ?","Liberté, Égalité, Fraternité"],
["À quel âge vote-t-on ?","18 ans"],
["Qu'est-ce que la laïcité ?","Neutralité de l'État et liberté de conscience"],
["Quel est le rôle de l'Assemblée nationale ?","Voter les lois"],
["Pourquoi vérifier ses sources ?","Pour éviter les fausses informations"]
]
};

function tirer(cat){
 const q=data[cat][Math.floor(Math.random()*data[cat].length)];
 document.getElementById('matiere').innerText=cat==='h'?'Histoire':cat==='g'?'Géographie':'EMC';
 document.getElementById('question').innerHTML=q[0]+'<br><br><button onclick="afficher()">Afficher la réponse</button>';
 window.rep=q[1];
 document.getElementById('reponse').innerText='';
}
function afficher(){document.getElementById('reponse').innerHTML='<b>Réponse :</b> '+window.rep;}
</script>
</body>
</html>
