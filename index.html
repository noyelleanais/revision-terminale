function tirerQuestion(categorie){

const liste = banqueQuestions[categorie];

let disponible = [];

for(let i=0;i<liste.length;i++){

if(!questionsUtilisees[categorie].includes(i)){
disponible.push(i);
}

}

if(disponible.length===0){

questionsUtilisees[categorie]=[];

for(let i=0;i<liste.length;i++){
disponible.push(i);
}

}

const index =
disponible[Math.floor(Math.random()*disponible.length)];

questionsUtilisees[categorie].push(index);

const q = liste[index];

let nomCategorie="";

if(categorie==="histoire"){
nomCategorie="🟧🟪 Histoire";
}

if(categorie==="geo"){
nomCategorie="🟦🟩 Géographie";
}

if(categorie==="emc"){
nomCategorie="🟥 EMC";
}

document.getElementById("categorie").textContent =
nomCategorie;

document.getElementById("niveau").textContent =
q.niveau;

document.getElementById("question").textContent =
q.question;

document.getElementById("reponse").textContent =
"";

reponseActuelle = q.reponse;

}
